[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juana-client"
version = "0.1.0"
description = "Python client for Apollo (Juana) - connects to Cloudflare Worker via WebSocket for voice interaction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "pyaudio>=0.2.14",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
wake = [
    "vosk>=0.3.45",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio-mode = "auto"